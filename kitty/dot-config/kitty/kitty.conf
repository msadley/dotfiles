# font_family family="Liga SFMonoNerdFont"
font_size 12
disable_ligatures never

hide_window_decorations yes
window_padding_width 4

cursor_shape block
cursor_blink_interval 1

paste_actions replace-dangerous-control-codes
linux_display_server wayland

# include ./Rosé Pine.conf

# Generated by caelestia from ~/.config/caelestia/templates/kitty.conf
# (run `caelestia scheme set --mode dark` once if this file is missing)
include ~/.local/state/caelestia/theme/kitty.conf

map ctrl+left send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C


# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
