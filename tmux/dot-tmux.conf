# Unbind the default prefix (Ctrl+b)
unbind C-b

# Set the new prefix to Ctrl+a
set-option -g prefix C-a

# Allow sending 'Ctrl+a' to applications (like bash or vim) by pressing it twice
bind-key C-a send-prefix

# Minimal tab layout on top — no background, just text
set -g status on
set -g status-position top
set -g status-justify left

# Transparent / no background
set -g status-style bg=default,fg=default
set -g window-status-style bg=default,fg=colour245
set -g window-status-current-style bg=default,fg=default,bold
set -g window-status-activity-style bg=default
set -g window-status-bell-style bg=default

# Very minimal tabs: " 1:name "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator " "

# No extra clutter
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0
